<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:#F7F8FB; color:#4B5163;
  }
  .box{ text-align:center; padding:40px; }
  h1{ font-size:1.4rem; color:#1F2430; margin-bottom:8px; }
  p{ font-size:.95rem; }
  a{ color:#1B2A5B; }
</style>
</head>
<body>
  <div class="box">
    <h1>404 — Page Not Found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <p><a href="index.html">Return home</a></p>
  </div>

  <!-- This page intentionally logs its own visits separately and never
       reveals anything about how the real admin area works. -->
  <script>window.BLL_SKIP_AUTO_VISIT_LOG = true;</script>
  <script type="module">
    import "js/firebase-init.js";
    // Give the module a moment to attach window.BLL, then log this as a
    // decoy visit (not a normal page visit) and redirect quietly.
    const tryLog = () => {
      if (window.BLL && window.BLL.logDecoyVisit) {
        window.BLL.logDecoyVisit();
      } else {
        setTimeout(tryLog, 250);
      }
    };
    tryLog();
    setTimeout(() => { window.location.href = 'index.html'; }, 3500);
  </script>
</body>
</html>
