<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLL — Bamyon Learning Lab | Teach It Yourself. Trust Yourself.</title>
<meta name="description" content="BLL turns dense course material into something you can picture, explain, and use — free, beginner-first study guides built for real understanding, not just exam recall.">

<!-- Self-contained favicon (no separate file needed) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231B2A5B'/%3E%3Ctext x='50' y='69' font-family='Georgia,serif' font-size='58' font-weight='700' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     BLL — DESIGN TOKENS
     ============================================================ */
  :root{
    --bg:            #F7F8FB;
    --bg-alt:        #EEF1FA;
    --bg-warm:       #FFF6E6;
    --navy:          #1B2A5B;
    --navy-deep:     #131F45;
    --orange:        #F5A623;
    --orange-deep:   #DB8F13;
    --ink:           #1F2430;
    --ink-soft:      #4B5163;
    --ink-faint:     #7A8098;
    --white:         #FFFFFF;
    --border:        #E2E6F2;

    --font-serif: 'Literata', Georgia, serif;
    --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --max-w: 1180px;
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 28px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3{
    font-family: var(--font-serif);
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 0.5em 0;
    color: var(--navy-deep);
  }

  p{ margin: 0 0 1em 0; color: var(--ink-soft); }
  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 24px;
  }

  .skip-link{
    position: absolute; left: -999px; top: 0;
    background: var(--navy); color: #fff; padding: 12px 18px;
    border-radius: 0 0 8px 0; z-index: 999;
  }
  .skip-link:focus{ left: 0; }

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 3px solid var(--orange);
    outline-offset: 2px;
  }

  section{ padding: 88px 0; }
  @media (max-width: 720px){ section{ padding: 56px 0; } }

  .btn{
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-sans); font-weight: 600; font-size: 0.98rem;
    padding: 14px 26px; border-radius: 999px; border: 2px solid transparent;
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn-primary{ background: var(--orange); color: var(--navy-deep); }
  .btn-primary:hover{ background: var(--orange-deep); }
  .btn-ghost{ background: transparent; color: var(--navy); border-color: var(--border); }
  .btn-ghost:hover{ border-color: var(--navy); }

  /* ============================================================
     NAVIGATION
     ============================================================ */
  header.site-header{
    position: sticky; top: 0; z-index: 200;
    background: rgba(247,248,251,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-row{
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    max-width: var(--max-w); margin: 0 auto;
  }
  .brand{ display: flex; align-items: center; gap: 10px; }
  .brand svg{ width: 38px; height: 38px; display: block; flex-shrink: 0; }
  .brand-text{ font-family: var(--font-serif); font-weight: 700; font-size: 1.25rem; color: var(--navy-deep); }
  .brand-text span{ color: var(--orange-deep); }

  nav.main-links{ display: flex; align-items: center; gap: 30px; }
  nav.main-links a{
    font-size: 0.96rem; font-weight: 500; color: var(--ink-soft);
    padding: 6px 2px; border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  nav.main-links a:hover{ color: var(--navy-deep); border-color: var(--orange); }

  .nav-actions{ display: flex; align-items: center; gap: 14px; }

  .subscribe-toggle{
    font-family: var(--font-sans); font-weight: 600; font-size: 0.92rem;
    background: var(--navy); color: #fff; border: none; border-radius: 999px;
    padding: 10px 20px; cursor: pointer;
  }
  .subscribe-toggle:hover{ background: var(--navy-deep); }

  .hamburger{
    display: none; flex-direction: column; gap: 5px;
    background: none; border: none; cursor: pointer; padding: 8px;
  }
  .hamburger span{ width: 24px; height: 2px; background: var(--navy-deep); display: block; }

  /* Inline subscribe drawer — lives in the header flow, not a popup */
  .subscribe-drawer{
    max-height: 0; overflow: hidden;
    background: var(--navy);
    transition: max-height 0.35s ease;
  }
  .subscribe-drawer.open{ max-height: 140px; }
  .subscribe-inner{
    max-width: var(--max-w); margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-top: 20px; padding-bottom: 20px;
  }
  .subscribe-inner p{ color: #C9D1EC; margin: 0; font-size: 0.94rem; min-width: 220px; }
  .subscribe-inner form{ display: flex; gap: 10px; flex: 1; min-width: 260px; }
  .subscribe-inner input[type="email"]{
    flex: 1; padding: 12px 16px; border-radius: 999px; border: none;
    font-family: var(--font-sans); font-size: 0.95rem;
  }
  .subscribe-close{
    background: none; border: none; color: #C9D1EC; cursor: pointer; font-size: 1.3rem;
    line-height: 1; padding: 4px 8px;
  }
  .subscribe-msg{
    width: 100%; font-size: 0.88rem; color: var(--orange); margin-top: 8px; min-height: 1em;
  }

  @media (max-width: 900px){
    nav.main-links{
      position: fixed; inset: 64px 0 auto 0; background: var(--white);
      flex-direction: column; align-items: flex-start; gap: 0;
      padding: 10px 24px 20px; border-bottom: 1px solid var(--border);
      transform: translateY(-120%); transition: transform 0.25s ease;
    }
    nav.main-links.open{ transform: translateY(0); }
    nav.main-links a{ width: 100%; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .hamburger{ display: flex; }
    .nav-actions .subscribe-toggle{ font-size: 0.85rem; padding: 9px 16px; }
  }

  /* ============================================================
     HERO
     ============================================================ */
  .hero{ padding: 72px 0 60px; }
  .hero-grid{ display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; }
  .hero h1{ font-size: clamp(2.1rem, 4vw, 3.3rem); color: var(--navy-deep); }
  .hero h1 em{ font-style: normal; color: var(--orange-deep); }
  .hero p.lede{ font-size: 1.15rem; color: var(--ink-soft); max-width: 46ch; margin-bottom: 1.6em; }
  .hero-ctas{ display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 28px; }
  .hero-trust{ display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--ink-faint); }
  .hero-trust .dots{ display: flex; }
  .hero-trust .dots span{
    width: 26px; height: 26px; border-radius: 50%; background: var(--bg-alt);
    border: 2px solid var(--bg); margin-left: -8px; display: inline-block;
  }
  .hero-trust .dots span:first-child{ margin-left: 0; }

  .hero-art{ position: relative; }
  .hero-art svg{ width: 100%; height: auto; display: block; }

  @keyframes orbit-spin{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
  @keyframes orbit-spin-rev{ from{ transform: rotate(360deg); } to{ transform: rotate(0deg); } }
  .orbit-ring-a{ transform-origin: 300px 300px; animation: orbit-spin 46s linear infinite; }
  .orbit-ring-b{ transform-origin: 300px 300px; animation: orbit-spin-rev 60s linear infinite; }

  @media (max-width: 900px){
    .hero-grid{ grid-template-columns: 1fr; gap: 40px; }
    .hero-art{ order: -1; max-width: 380px; margin: 0 auto; }
  }

  /* ============================================================
     PROBLEM SECTION
     ============================================================ */
  .problem{ background: var(--bg-alt); }
  .problem-grid{ display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 56px; align-items: start; }
  .problem h2{ font-size: clamp(1.7rem, 3vw, 2.3rem); max-width: 14ch; }
  .problem-list{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 22px; }
  .problem-list li{
    display: flex; gap: 16px; align-items: flex-start;
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-m);
    padding: 20px 22px;
  }
  .problem-list li svg{ flex-shrink: 0; width: 30px; height: 30px; }
  .problem-list li h3{ font-size: 1.05rem; margin-bottom: 4px; color: var(--navy-deep); }
  .problem-list li p{ margin: 0; font-size: 0.96rem; }

  @media (max-width: 900px){ .problem-grid{ grid-template-columns: 1fr; } }

  /* ============================================================
     METHOD SECTION
     ============================================================ */
  .method-head{ max-width: 60ch; margin-bottom: 48px; }
  .method-head h2{ font-size: clamp(1.7rem, 3vw, 2.3rem); }
  .method-grid{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .method-card{ background: var(--white); border-radius: var(--radius-m); border: 1px solid var(--border); padding: 26px 22px; }
  .method-card .icon-badge{
    width: 52px; height: 52px; border-radius: 14px; background: var(--bg-warm);
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
  }
  .method-card .icon-badge svg{ width: 26px; height: 26px; }
  .method-card h3{ font-size: 1.05rem; margin-bottom: 6px; color: var(--navy-deep); }
  .method-card p{ font-size: 0.92rem; margin: 0; }

  @media (max-width: 900px){ .method-grid{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px){ .method-grid{ grid-template-columns: 1fr; } }

  /* ============================================================
     HOW IT WORKS
     ============================================================ */
  .works{ background: var(--navy); color: #fff; }
  .works h2{ color: #fff; font-size: clamp(1.7rem, 3vw, 2.3rem); max-width: 20ch; margin-bottom: 40px; }
  .works-steps{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .works-step{ position: relative; padding-top: 8px; }
  .works-step .num{
    font-family: var(--font-serif); font-size: 2.6rem; font-weight: 700;
    color: var(--orange); display: block; margin-bottom: 10px; line-height: 1;
  }
  .works-step h3{ color: #fff; font-size: 1.1rem; margin-bottom: 8px; }
  .works-step p{ color: #B9C2E0; margin: 0; font-size: 0.95rem; }

  @media (max-width: 800px){ .works-steps{ grid-template-columns: 1fr; } }

  /* ============================================================
     SYMBOLS SECTION — flip cards (subject-agnostic)
     ============================================================ */
  .symbols-head{ max-width: 60ch; margin-bottom: 40px; }
  .symbols-head h2{ font-size: clamp(1.7rem, 3vw, 2.3rem); }
  .symbol-grid{ display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; perspective: 1000px; }
  .symbol-card{ position: relative; height: 150px; cursor: pointer; }
  .symbol-card .flip-inner{
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform 0.5s ease;
    border-radius: var(--radius-m);
  }
  .symbol-card.is-flipped .flip-inner{ transform: rotateY(180deg); }
  .symbol-face{
    position: absolute; inset: 0; border-radius: var(--radius-m);
    display: flex; align-items: center; justify-content: center; text-align: center;
    backface-visibility: hidden; padding: 14px;
  }
  .symbol-front{
    background: var(--white); border: 1px solid var(--border);
    font-family: var(--font-serif); font-style: italic; font-size: 2.4rem; color: var(--navy-deep);
  }
  .symbol-back{
    background: var(--navy); color: #fff; transform: rotateY(180deg);
    font-size: 0.82rem; line-height: 1.4; font-weight: 500;
  }
  .symbol-hint{ font-size: 0.82rem; color: var(--ink-faint); margin-top: 16px; }

  @media (max-width: 900px){ .symbol-grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 480px){ .symbol-grid{ grid-template-columns: repeat(2, 1fr); } }

  /* ============================================================
     MINDS SECTION (generalized — spans multiple fields)
     ============================================================ */
  .masterminds{ background: var(--bg-warm); }
  .masterminds-head{ max-width: 60ch; margin-bottom: 40px; }
  .masterminds-head h2{ font-size: clamp(1.7rem, 3vw, 2.3rem); }
  .mind-grid{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .mind-card{ text-align: left; }
  .mind-badge{
    width: 64px; height: 64px; border-radius: 50%; background: var(--navy);
    color: var(--orange); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif); font-weight: 700; font-size: 1.2rem; margin-bottom: 14px;
  }
  .mind-card h3{ font-size: 1rem; margin-bottom: 4px; color: var(--navy-deep); }
  .mind-card p{ font-size: 0.9rem; margin: 0; }

  @media (max-width: 900px){ .mind-grid{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px){ .mind-grid{ grid-template-columns: 1fr; } }

  /* ============================================================
     COURSES
     ============================================================ */
  .courses-head{
    display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
    margin-bottom: 40px; flex-wrap: wrap;
  }
  .courses-head h2{ font-size: clamp(1.7rem, 3vw, 2.3rem); margin: 0; max-width: 20ch; }
  .course-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .course-card{
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-l);
    padding: 28px; display: flex; flex-direction: column;
  }
  .course-card.is-live{ border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy) inset; }
  .course-tag{
    display: inline-flex; align-self: flex-start; font-size: 0.76rem; font-weight: 700;
    padding: 5px 12px; border-radius: 999px; margin-bottom: 16px;
  }
  .tag-live{ background: var(--bg-warm); color: var(--orange-deep); }
  .tag-soon{ background: var(--bg-alt); color: var(--ink-faint); }
  .course-card h3{ font-size: 1.2rem; margin-bottom: 8px; color: var(--navy-deep); }
  .course-card p{ font-size: 0.92rem; flex-grow: 1; }
  .course-meta{ font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 20px; }
  .course-card .btn{ align-self: flex-start; }
  .course-card.is-soon{ opacity: 0.75; }

  @media (max-width: 900px){ .course-grid{ grid-template-columns: 1fr; } }

  /* ============================================================
     FACTS ROTATOR
     ============================================================ */
  .facts{ background: var(--navy-deep); color: #fff; text-align: center; }
  .facts h2{ color: #fff; font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 30px; }
  .facts-box{ max-width: 680px; margin: 0 auto; min-height: 90px; display: flex; align-items: center; justify-content: center; }
  .facts-box p{
    font-family: var(--font-serif); font-style: italic; font-size: 1.25rem;
    color: #E4E9FA; margin: 0; transition: opacity 0.3s ease;
  }
  .facts-nav{ margin-top: 26px; display: flex; gap: 12px; justify-content: center; }
  .facts-dot{ width: 8px; height: 8px; border-radius: 50%; background: #3A4778; border: none; cursor: pointer; padding: 0; }
  .facts-dot.active{ background: var(--orange); }

  /* ============================================================
     SUBSCRIBE SECTION
     ============================================================ */
  .subscribe-section{ background: var(--bg-alt); text-align: center; }
  .subscribe-section h2{ font-size: clamp(1.6rem, 3vw, 2.1rem); }
  .subscribe-section p{ max-width: 46ch; margin: 0 auto 28px; }
  .subscribe-section form{ max-width: 440px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .subscribe-section input[type="email"]{
    flex: 1; min-width: 220px; padding: 14px 18px; border-radius: 999px;
    border: 1px solid var(--border); font-family: var(--font-sans); font-size: 0.95rem;
  }
  .subscribe-section-msg{ margin-top: 14px; font-size: 0.9rem; color: var(--navy); min-height: 1.2em; }
  .subscribe-section .fineprint{ margin-top: 16px; font-size: 0.82rem; color: var(--ink-faint); }

  /* ============================================================
     FOOTER
     ============================================================ */
  footer{ background: var(--navy-deep); color: #C9D1EC; padding: 64px 0 32px; }
  .footer-grid{ display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 48px; }
  .footer-brand .brand-text{ color: #fff; }
  .footer-brand p{ color: #9AA5CC; font-size: 0.9rem; max-width: 32ch; margin-top: 14px; }
  footer h4{ color: #fff; font-size: 0.95rem; margin-bottom: 16px; font-family: var(--font-sans); font-weight: 600; }
  footer ul{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  footer ul a{ color: #B0B9DC; font-size: 0.9rem; }
  footer ul a:hover{ color: #fff; }
  .socials{ display: flex; gap: 12px; margin-top: 4px; }
  .socials a{
    width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .socials a:hover{ background: var(--orange); }
  .socials svg{ width: 17px; height: 17px; }
  .footer-bottom{
    border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    font-size: 0.82rem; color: #8892B8;
  }

  @media (max-width: 900px){ .footer-grid{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px){ .footer-grid{ grid-template-columns: 1fr; } }

</style>
</head>

  <div class="nav-row">
